AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  eighty-twenty

  SAM Template for Eighty-Twenty Salary Calculator application with DynamoDB, API Gateway and Lambda.

# Global configuration for all functions
Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.11
    Environment:
      Variables:
        DYNAMODB_TABLE_NAME: !Ref SalaryCalculationsTable
        DYNAMODB_SETTINGS_TABLE_NAME: !Ref UserSettingsTable
        REGION: !Ref AWS::Region
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: "'*'"

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Environment name for the deployment

Resources:
  # DynamoDB Table for Salary Calculations
  SalaryCalculationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub eighty-twenty-calculations-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: eighty-twenty
        - Key: ManagedBy
          Value: SAM

  # DynamoDB Table for User Settings
  UserSettingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub eighty-twenty-settings-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: eighty-twenty
        - Key: ManagedBy
          Value: SAM

  # Lambda Function for Create Calculation
  CreateCalculationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub eighty-twenty-create-calculation-${Environment}
      CodeUri: backend/
      Handler: lambda_app.lambda_handlers.create_calculation
      Description: Create a new salary calculation
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SalaryCalculationsTable
      Events:
        CreateCalculation:
          Type: Api
          Properties:
            Path: /calculations
            Method: POST
            RestApiId: !Ref EightyTwentyApi

  # Lambda Function for Get All Calculations
  GetCalculationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub eighty-twenty-get-calculations-${Environment}
      CodeUri: backend/
      Handler: lambda_app.lambda_handlers.get_calculations
      Description: Get all salary calculations
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SalaryCalculationsTable
      Events:
        GetCalculations:
          Type: Api
          Properties:
            Path: /calculations
            Method: GET
            RestApiId: !Ref EightyTwentyApi

  # Lambda Function for Get Single Calculation
  GetCalculationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub eighty-twenty-get-calculation-${Environment}
      CodeUri: backend/
      Handler: lambda_app.lambda_handlers.get_calculation
      Description: Get a specific salary calculation by ID
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SalaryCalculationsTable
      Events:
        GetCalculation:
          Type: Api
          Properties:
            Path: /calculations/{id}
            Method: GET
            RestApiId: !Ref EightyTwentyApi

  # Lambda Function for Update Calculation
  UpdateCalculationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub eighty-twenty-update-calculation-${Environment}
      CodeUri: backend/
      Handler: lambda_app.lambda_handlers.update_calculation
      Description: Update an existing salary calculation
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SalaryCalculationsTable
      Events:
        UpdateCalculation:
          Type: Api
          Properties:
            Path: /calculations/{id}
            Method: PUT
            RestApiId: !Ref EightyTwentyApi

  # Lambda Function for Delete Calculation
  DeleteCalculationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub eighty-twenty-delete-calculation-${Environment}
      CodeUri: backend/
      Handler: lambda_app.lambda_handlers.delete_calculation
      Description: Delete a salary calculation
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SalaryCalculationsTable
      Events:
        DeleteCalculation:
          Type: Api
          Properties:
            Path: /calculations/{id}
            Method: DELETE
            RestApiId: !Ref EightyTwentyApi

  # Lambda Function for Get Settings
  GetSettingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub eighty-twenty-get-settings-${Environment}
      CodeUri: backend/
      Handler: lambda_app.lambda_handlers.get_settings
      Description: Get user settings
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserSettingsTable
      Events:
        GetSettings:
          Type: Api
          Properties:
            Path: /settings/{email}
            Method: GET
            RestApiId: !Ref EightyTwentyApi

  # Lambda Function for Update Settings
  UpdateSettingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub eighty-twenty-update-settings-${Environment}
      CodeUri: backend/
      Handler: lambda_app.lambda_handlers.update_settings
      Description: Update user settings
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserSettingsTable
      Events:
        UpdateSettings:
          Type: Api
          Properties:
            Path: /settings
            Method: POST
            RestApiId: !Ref EightyTwentyApi

  # API Gateway REST API
  EightyTwentyApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub eighty-twenty-api-${Environment}
      StageName: !Ref Environment
      Description: API Gateway for Eighty-Twenty Salary Calculator
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
      DefinitionBody:
        openapi: 3.0.1
        info:
          title: Eighty-Twenty Salary Calculator API
          description: API for calculating salary distribution based on the 80/20 principle
          version: 1.0.0
        paths:
          /calculations:
            post:
              summary: Create a new salary calculation
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateCalculationFunction.Arn}/invocations
              responses:
                "201":
                  description: Calculation created successfully
            get:
              summary: Get all salary calculations
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetCalculationsFunction.Arn}/invocations
              responses:
                "200":
                  description: List of calculations
          /calculations/{id}:
            get:
              summary: Get a specific calculation
              parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetCalculationFunction.Arn}/invocations
              responses:
                "200":
                  description: Calculation details
            put:
              summary: Update a calculation
              parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateCalculationFunction.Arn}/invocations
              responses:
                "200":
                  description: Calculation updated
            delete:
              summary: Delete a calculation
              parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DeleteCalculationFunction.Arn}/invocations
              responses:
                "200":
                  description: Calculation deleted
          /settings:
            post:
              summary: Update user settings
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateSettingsFunction.Arn}/invocations
              responses:
                "200":
                  description: Settings updated
          /settings/{email}:
            get:
              summary: Get user settings
              parameters:
                - name: email
                  in: path
                  required: true
                  schema:
                    type: string
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetSettingsFunction.Arn}/invocations
              responses:
                "200":
                  description: User settings

  GoogleClientIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Type: String
      Name: !Sub '/environment/services/eighty-twenty/google.client.id'
      Value: 'your-google-client-id.apps.googleusercontent.com'
      Tags:
        eighty-twenty:creationSource: !Sub 'cloudformation/${AWS::StackId}'

# Outputs for easy reference
Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${EightyTwentyApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/
    Export:
      Name: !Sub ${AWS::StackName}-ApiUrl

  DynamoDBTableName:
    Description: DynamoDB table name
    Value: !Ref SalaryCalculationsTable
    Export:
      Name: !Sub ${AWS::StackName}-TableName

  DynamoDBTableArn:
    Description: DynamoDB table ARN
    Value: !GetAtt SalaryCalculationsTable.Arn
    Export:
      Name: !Sub ${AWS::StackName}-TableArn

  CreateCalculationFunctionArn:
    Description: Create Calculation Lambda Function ARN
    Value: !GetAtt CreateCalculationFunction.Arn

  GetCalculationsFunctionArn:
    Description: Get Calculations Lambda Function ARN
    Value: !GetAtt GetCalculationsFunction.Arn

  GetCalculationFunctionArn:
    Description: Get Calculation Lambda Function ARN
    Value: !GetAtt GetCalculationFunction.Arn

  UpdateCalculationFunctionArn:
    Description: Update Calculation Lambda Function ARN
    Value: !GetAtt UpdateCalculationFunction.Arn

  DeleteCalculationFunctionArn:
    Description: Delete Calculation Lambda Function ARN
    Value: !GetAtt DeleteCalculationFunction.Arn

  Region:
    Description: AWS Region
    Value: !Ref AWS::Region
